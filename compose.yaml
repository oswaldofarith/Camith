# Stack de producción para el VPS:  docker compose up -d --build
# Requiere un archivo .env en la raíz (ver .env.example).

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    # Si el servicio osrm no está levantado, el backend estima los tiempos.
    OSRM_URL: http://osrm:5000
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    volumes:
      - static:/data/static
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel", "info"]
    environment:
      DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OSRM_URL: http://osrm:5000
      RUN_MIGRATIONS: "0"
    volumes:
      - media:/data/media

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel", "info", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgis://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"

  # Motor de rutas (calles de OpenStreetMap). Requiere ejecutar antes
  # deploy/mapas/preparar.sh y se levanta con: docker compose --profile mapas up -d
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["mapas"]
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "500", "/data/guayaquil.osrm"]
    volumes:
      - ./deploy/mapas/datos/osrm:/data:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - ./deploy/mapas/datos/publico:/srv/mapas:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  static:
  media:
  caddy_data:
  caddy_config:
